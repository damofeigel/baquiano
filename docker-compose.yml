services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LOAD_SEED: ${DB_LOAD_SEED:-false}
    container_name: ${DB_CONTAINER_NAME:-mapa-deeptech-unc}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baquiano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mapa-deeptech-unc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
